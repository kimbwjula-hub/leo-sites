<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Nitro Vendas</title>
<style>
:root{--g:#008069;--g2:#25d366;--gd:#005c4b;--ink:#111b21;--mut:#667781;--line:#e9edef;--bg:#fff;--chat:#efeae2;--out:#d9fdd3;--red:#d93025;--amb:#c26c00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.center{min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--mut)}
/* escolher nicho */
.pick{max-width:520px;margin:0 auto}
.pick h1{margin:0;background:var(--g);color:#fff;font-size:19px;font-weight:600;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
.pick>p{margin:0;padding:14px 16px 6px;color:var(--mut);font-size:13.5px}
.niche{display:block;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
.niche b{display:block;font-size:16px;font-weight:600}.niche small{color:var(--mut);font-size:13.5px}
.niche.on b{color:var(--g)}
.logo,.em,.chev,.saving{display:none}
/* topo verde + abas */
.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding-top:env(safe-area-inset-top)}
.tb{display:flex;align-items:center;height:54px;padding:0 6px 0 16px}
.pill{font-size:19px;font-weight:600;color:#fff}
.pill:after{content:" ▾";font-size:13px;opacity:.8}
.icb{margin-left:auto;width:44px;height:44px;color:#fff;font-size:22px;line-height:44px;text-align:center}
.nav{display:flex;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 1 auto;padding:0 6px;height:44px;color:rgba(255,255,255,.75);font-size:13.5px;font-weight:600;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.nav button svg{display:none}
.nav button.on{color:#fff;border-bottom-color:#fff}
.nav .bd{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#fff;color:var(--g);font-size:11px;font-weight:700;display:inline-grid;place-items:center;letter-spacing:0}
main{max-width:640px;margin:0 auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
/* faixa do dia / avisos */
.day{display:block;width:100%;text-align:left;padding:10px 16px;font-size:13px;color:var(--mut);background:#f7f8fa;border-bottom:1px solid var(--line)}
.day b{color:var(--ink)}.day .hit{color:var(--g)}
.note{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff8e6;border-bottom:1px solid var(--line);font-size:13.5px}
.note .btn{margin-left:auto}
.sec{padding:14px 16px 6px;font-size:12.5px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.3px}
.sec.r{color:var(--red)}.sec.a{color:var(--amb)}
/* linha de conversa */
.chat{display:flex;align-items:center;gap:12px;width:100%;padding:0 16px;text-align:left;cursor:pointer;background:var(--bg)}
.chat:active{background:#f0f2f5}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
.cb{flex:1;min-width:0;padding:12px 0;border-bottom:1px solid var(--line)}
.l1,.l2{display:flex;align-items:center;gap:8px}
.l1 b{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;color:var(--mut);white-space:nowrap}
.tm.r{color:var(--red)}.tm.g{color:var(--g2);font-weight:600}
.l2{margin-top:2px}
.l2 span{flex:1;min-width:0;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2 .r{color:var(--red)}.l2 .a{color:var(--amb)}.l2 .g{color:var(--g)}
.bdg{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--g2);color:#fff;font-size:11.5px;font-weight:700;font-style:normal;display:grid;place-items:center}
.money{font-weight:700;color:var(--g);font-size:15px;white-space:nowrap}
.srch{display:block;width:calc(100% - 24px);margin:10px 12px 4px;height:38px;padding:0 14px;border:0;border-radius:19px;background:#f0f2f5;outline:none}
/* fila = conversa */
.fhead{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.fhead .nm{flex:1;min-width:0}
.fhead b{display:block;font-size:16px;font-weight:600}
.meta{display:block;color:var(--mut);font-size:13px}
.fchat{background:var(--chat);padding:18px 12px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.bub{align-self:flex-end;max-width:86%;background:var(--out);border-radius:8px 0 8px 8px;padding:7px 10px 6px;font-size:15px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.bub small{display:block;text-align:right;font-size:11px;color:var(--mut);margin-top:2px}
.fact{padding:12px 16px}
.next{padding:0 16px 14px;color:var(--mut);font-size:13px}
.links{display:flex;justify-content:center;gap:28px;margin-top:10px}
.txt{color:var(--mut);font-size:14px;padding:6px 0}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;background:var(--bg);color:var(--g)}
.btn svg{width:18px;height:18px}
.btn.go,.btn.wa,.btn.ok,.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.big{width:100%;height:48px;font-size:15.5px;border-radius:24px}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:#fff;font-weight:600}
/* vazio e importar */
.empty{padding:28px 20px;text-align:center;color:var(--mut)}
.empty h3{margin:0 0 6px;font-size:16px;color:var(--ink);font-weight:600}
.empty p{margin:0 0 14px}
textarea.paste{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none;font-size:14px;resize:vertical;text-align:left}
textarea.paste:focus{border-color:var(--g)}
.row2{display:flex;gap:8px;margin-top:10px}.row2 .btn{flex:1}
.err{color:var(--red);font-size:13px;margin-top:6px}
.addbar{display:flex;justify-content:flex-end;padding:8px 16px 0}
.addbar button{color:var(--g);font-weight:600;font-size:14px}
/* vendas */
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
.tbl td:last-child{text-align:right;font-weight:700}
/* folha (perfil da empresa) */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(11,20,26,.4);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:0 0 calc(10px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.grab{width:36px;height:4px;border-radius:2px;background:#d1d7db;margin:8px auto 0}
.ph{display:flex;align-items:center;gap:12px;padding:12px 16px 14px;border-bottom:8px solid #f0f2f5}
.ph b{display:block;font-size:18px;font-weight:600}
.sh>h3{margin:0;padding:14px 16px 4px;font-size:17px;font-weight:600}
.sh>p,.sh .sub{margin:0;padding:0 16px 12px;color:var(--mut);font-size:13.5px}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;font-size:15.5px;border-bottom:1px solid var(--line)}
.act i{font-style:normal;width:24px;text-align:center;color:var(--g);font-size:18px}
.act small{display:block;color:var(--mut);font-size:12.5px}
.act.main{color:var(--g);font-weight:600}
.act.red,.act.red i{color:var(--red)}
.stepbox{padding:12px 16px;border-bottom:1px solid var(--line)}
.stepbox .lb{font-size:12.5px;color:var(--mut);margin-bottom:6px}
.inrow{display:flex;gap:8px}
.inp{flex:1;min-width:0;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:20px;outline:none;background:#f0f2f5}
.inp:focus{border-color:var(--g);background:#fff}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15.5px}
.mi:last-child{border-bottom:0}
.mi i{display:none}
.mi.red{color:var(--red)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 16px 10px}
.chips button{height:44px;border:1px solid var(--line);border-radius:22px;font-weight:700;color:var(--g)}
.sh .inp.full,#val{display:block;width:calc(100% - 32px);margin:0 16px;flex:none}
.sh .row2,.sh .err{padding:0 16px}
.lbl{display:block;font-weight:600;font-size:13px;color:var(--g);margin:14px 16px 6px}
.sh textarea.msg{display:block;width:calc(100% - 32px);margin:0 16px;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;outline:none;font-size:14px}
.sh .paste{margin:0 16px;width:calc(100% - 32px)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:80;max-width:520px;margin:0 auto;background:#3b4a54;color:#fff;padding:12px 14px;border-radius:8px;font-size:14px;display:flex;align-items:center;gap:10px}
.toast span{flex:1}.tu{color:#53e6a2;font-weight:700}
.xp{position:fixed;inset:0;z-index:60;background:#f0f2f5;display:flex;flex-direction:column}
.xh{background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;min-height:56px}
.xh button{background:none;border:0;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%}
.xh .av{width:40px;height:40px;border-radius:50%;background:#dfe5e7;color:var(--g);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.xh .tt{flex:1;min-width:0}.xh .tt b{display:block;font-size:17px;font-weight:500}.xh .tt small{font-size:13px;opacity:.9}
.xbody{flex:1;overflow:auto;padding-bottom:84px}
.xc{background:#fff;margin-top:8px}.xc .cap{color:var(--g);font-size:14px;font-weight:500;padding:14px 16px 6px}
.xr{display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:56px;border-bottom:1px solid var(--line)}
.xr:last-child{border-bottom:0}.xr .ic{width:24px;text-align:center;color:var(--mut);font-size:19px;flex:none}
.xr .tx{flex:1;min-width:0}.xr .tx b{display:block;font-weight:400;font-size:16px;color:var(--ink)}.xr .tx small{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.xr input[type=time]{width:104px!important}.xr input[type=number],.xr input[type=time]{width:74px;height:36px;border:0;border-bottom:2px solid var(--g);background:none;font-size:16px;text-align:center;color:var(--ink);outline:none}
.xr .to{color:var(--mut);font-size:14px}
.sw{position:relative;width:40px;height:22px;flex:none}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;border-radius:11px;background:#c4ccd0;transition:.2s}
.sw i:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+i{background:var(--g)}.sw input:checked+i:before{transform:translateX(18px)}
.xst{padding:12px 16px 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xst .k{background:#f0f2f5;border-radius:10px;padding:10px 12px}.xst .k small{display:block;font-size:12px;color:var(--mut)}.xst .k b{font-size:18px;font-weight:600;color:var(--ink)}
.xdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.xline{padding:8px 16px 0;font-size:14px;color:var(--ink)}.xline .bad{color:var(--red)}.xline .ok{color:var(--g)}.xline .warn{color:var(--amb)}
.xacts{display:flex;gap:10px;padding:12px 16px 14px}.xacts button{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;color:var(--g);font-weight:600;font-size:15px}
.xacts .go{background:var(--g);color:#fff;border-color:var(--g)}.xacts .stop{background:#fff;color:var(--red);border-color:#f3c5c1}
.xdays{display:flex;gap:6px;padding:4px 16px 14px;flex-wrap:wrap}.xdays button{height:34px;min-width:42px;border-radius:17px;border:1px solid var(--line);background:#fff;color:var(--mut);font-size:13px}
.xdays button.on{background:#e7fce3;color:var(--gd);border-color:#b9e8b0;font-weight:600}
.xchat{background:var(--chat);padding:12px 10px 6px;min-height:120px}
.xpill{display:flex;justify-content:center;margin:8px 0}.xpill span{background:#fff;color:var(--mut);font-size:12.5px;border-radius:8px;padding:5px 10px;box-shadow:0 1px .5px rgba(11,20,26,.13);display:inline-flex;gap:6px;align-items:center}
.xpill input{width:46px;border:0;border-bottom:1px solid var(--g);text-align:center;font-size:13px;background:none;outline:none}.xpill select{border:0;background:none;font-size:12.5px;color:var(--g);outline:none}
.xbub{margin-left:auto;max-width:86%;background:var(--out);border-radius:8px 0 8px 8px;padding:6px 8px 4px;box-shadow:0 1px .5px rgba(11,20,26,.13);position:relative}
.xbub:after{content:"";position:absolute;right:-7px;top:0;border:8px solid transparent;border-top-color:var(--out);border-left-color:var(--out);border-right:0}
.xbub textarea{width:100%;min-height:44px;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);resize:none;outline:none;padding:2px 0;box-sizing:border-box}
.xbub .ft{display:flex;align-items:center;justify-content:flex-end;gap:2px;color:#667781;font-size:11px;margin-top:2px}
.xbub .ft button{background:none;border:0;color:#54656f;font-size:15px;width:30px;height:28px;border-radius:6px}
.xbub .ft .n{margin-right:auto;font-size:11.5px}
.xvo{display:flex;align-items:center;gap:10px;min-width:220px;padding:4px 2px}
.xvo .pl{width:34px;height:34px;border-radius:50%;border:0;background:none;color:#54656f;font-size:22px;flex:none}
.xvo .wv{flex:1;height:22px;background:repeating-linear-gradient(90deg,#8fa59b 0 2px,transparent 2px 5px);-webkit-mask:linear-gradient(0deg,#000 30%,transparent 30%,transparent 70%,#000 70%) ,linear-gradient(#000,#000);opacity:.8;border-radius:2px}
.xvo .mic{width:38px;height:38px;border-radius:50%;background:#e1e6e8;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.xfile{font-size:12.5px;color:var(--mut);padding:0 2px}.xfile .bad{color:var(--red)}.xfile .warn{color:var(--amb)}
.xmini{display:flex;gap:6px;margin:4px 0 2px}.xmini label,.xmini button{font-size:12.5px;border:0;border-radius:14px;background:rgba(0,128,105,.1);color:var(--gd);padding:6px 10px;font-weight:600}
.xmini .rec{background:#fde8e6;color:var(--red)}
.ximg img{display:block;max-width:100%;border-radius:6px;margin-bottom:4px}
.xadd{display:flex;justify-content:center;gap:22px;padding:14px 0 10px;background:var(--chat)}.xadd button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font-size:12px;color:var(--mut)}
.xadd button i{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;color:#fff}
.xadd .a1 i{background:#7f66ff}.xadd .a2 i{background:#ff2e74}.xadd .a3 i{background:#c861fa}
.xpend .xr{cursor:pointer}.xck{width:22px;height:22px;border-radius:50%;border:2px solid #aebac1;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.xck.on{background:var(--g2);border-color:var(--g2)}
.xlog .xr{min-height:0;padding:8px 16px;align-items:flex-start}.xlog .xr .tx b{font-size:14px}.xlog .tm{color:var(--mut);font-size:12px;flex:none;width:40px}
.xsave{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:61;display:flex;gap:10px;align-items:center}
.xsave button{flex:1;height:48px;border-radius:24px;border:0;background:var(--g);color:#fff;font-size:16px;font-weight:600}
.xsave .m{flex:1.3;font-size:13px;color:var(--mut)}.xsave .m .ok{color:var(--g);font-weight:600}.xsave .m .warn{color:var(--amb)}
body:has(#xpage) .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
.xtxa{width:100%;border:0;border-bottom:2px solid var(--g);font:inherit;font-size:15px;outline:none;resize:none;background:none;min-height:40px}
</style>
</head>
<body>
<div id="boot" class="center"><p>Carregando…</p></div>

<div id="pick" class="pick" hidden>
  <div class="logo">N</div>
  <h1>Nitro Vendas</h1>
  <p>Escolha o nicho que você vai prospectar</p>
  <button class="niche" data-n="estofado"><span><b>Limpeza de estofados</b><small>Sofás, colchões, bancos de carro</small></span><span class="chev">›</span></button>
  <button class="niche" data-n="solar"><span><b>Energia solar</b><small>Instalação e manutenção de placas</small></span><span class="chev">›</span></button>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="tb"><button class="pill" id="nicheBtn"></button><button class="icb" id="setBtn" aria-label="Ajustes">⋮</button></div>
    <nav class="nav" id="nav"><button data-tab="prospect">Fila<span class="bd" hidden></span></button><button data-tab="replies">Funil P1<span class="bd" hidden></span></button><button data-tab="resp">Funil P2<span class="bd" hidden></span></button><button data-tab="p3">Funil P3<span class="bd" hidden></span></button><button data-tab="sites">Interessados<span class="bd" hidden></span></button><button data-tab="sales">Vendas</button><button data-tab="lost">Não quis</button></nav>
  </header>
  <span id="saving" class="saving"></span>
  <main id="view"></main>

</div>

<div id="sheet" class="sheet" hidden><div class="sh" id="sh"></div></div>
<div id="toast" class="toast" hidden></div>
<script>
/* Nitro Vendas — camada de dados para Cloudflare (substitui o banco do artefato) */
(function () {
  var LS = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
  var m = /[#&]k=([a-z0-9]{24,64})/.exec(location.hash);
  if (m) { LS("nitro_key", m[1]); history.replaceState(null, "", location.pathname); }
  var KEY = "publico0000000000000000000000000"; // mesmo banco para qualquer aparelho
  window.NITRO_KEY = KEY;
  var state = { main: {}, chunks: {} }, docSubs = [], colSubs = [], loaded = false;
  try { var c = JSON.parse(LS("nitro_cache_" + KEY) || "null"); if (c && c.main) state = c; } catch (e) {}
  function cache() { try { LS("nitro_cache_" + KEY, JSON.stringify(state)); } catch (e) {} }
  function api(method, path, body) {
    return fetch("/api/" + path, { method: method, headers: { "x-key": KEY, "content-type": "application/json" }, body: body == null ? undefined : JSON.stringify(body), cache: "no-store" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || "http"); e.code = j.error === "tamanho" ? "quota_exceeded" : "unavailable"; throw e; } return j; }); });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function emitDoc(fromCache) { var snap = { exists: true, data: function () { return clone(state.main); }, metadata: { fromCache: !!fromCache } }; docSubs.forEach(function (f) { f(snap); }); }
  function emitCol(fromCache) {
    var docs = Object.keys(state.chunks).map(function (id) { return { id: id, data: function () { return clone(state.chunks[id]); } }; });
    var snap = { docs: docs, metadata: { fromCache: !!fromCache } }; colSubs.forEach(function (f) { f(snap); });
  }
  var pend = 0, wv = 0, lastVer = "";
  function pull() {
    if (pend) return Promise.resolve();
    var w0 = wv;
    return api("GET", "state").then(function (s) { if (pend || wv !== w0) return; state = { main: s.main || {}, chunks: s.chunks || {} }; loaded = true; cache(); emitDoc(false); emitCol(false); });
  }
  // tempo real: pergunta a cada 3 s se algo mudou; só baixa tudo quando mudou

houver WhatsApp mas houver telefone, troque os links por tel: com \"Ligar agora\". Nunca deixe botão sem destino.\n3.6 Se o Instagram da empresa não for informado, remova o cartão de Instagram de .contacts (não deixe o @limp.teck).\n3.7 No fim, NÃO pode sobrar no arquivo: \"Limpteck\", \"limp.teck\", \"Vitória da Conquista\", \"5577988056186\", \"(77) 98805-6186\", \"Limpeza Inteligente\" (exceto se for a mesma empresa).\n3.8 Português do Brasil, tom simpático e profissional, \"você\". Nada de lorem ipsum ou colchetes.\n\n==================================================\n4. SERVIÇOS DO NICHO\n==================================================\nO site original tem 6 cards (Sofás, Cadeiras, Camas box e colchões, Interior de carros, Cabine de caminhão, Tapetes e carpetes), a faixa que rola, 4 benefícios, a seção \"Por que higienizar\", 3 passos e 6 perguntas.\nSe os dados citarem serviços, use-os. Se não, crie os serviços típicos do nicho (4 a 6; apague cards e bolinhas .dots que sobrarem). Referência:\n- Estofados: sofás; cadeiras e poltronas; colchões e camas box; bancos e interior de carros; tapetes e carpetes; impermeabilização.\n- Lava-jato / estética automotiva: lavagem simples; lavagem completa; higienização interna; polimento; enceramento; limpeza de motor.\n- Dentista: avaliação e limpeza; clareamento; restaurações; canal; aparelho; implantes e próteses.\n- Salão de beleza: corte; escova e penteado; coloração e mechas; tratamentos capilares; manicure e pedicure; sobrancelhas.\n- Barbearia: corte; barba; corte + barba; pigmentação; sobrancelha; tratamento capilar.\n- Clínica de estética: limpeza de pele; tratamentos faciais; drenagem; massagem modeladora; depilação; protocolos corporais.\n- Energia solar: projeto; instalação de painéis; homologação; limpeza de placas; manutenção; sistemas para empresas e rurais.\n- Oficina mecânica: revisão; troca de óleo; freios; suspensão; injeção eletrônica; diagnóstico.\n- Ar-condicionado: instalação; limpeza e higienização; manutenção preventiva; conserto; carga de gás.\n- Eletricista: instalações; troca de fiação; quadros de energia; tomadas e iluminação; manutenção.\n- Encanador / desentupidora: desentupimento; caça-vazamento; instalação hidráulica; limpeza de caixa d'água.\n- Dedetização: dedetização; desratização; descupinização; escorpiões; sanitização.\n- Pet shop / veterinária: banho e tosa; consultas; vacinação; produtos e rações; hospedagem.\n- Academia: musculação; aulas coletivas; avaliação física; treino personalizado.\n- Restaurante / lanchonete / padaria: especialidades; prato do dia; encomendas; delivery e retirada.\n- Advocacia: áreas de atuação comuns; consultas; acompanhamento de processos.\n- Contabilidade: abertura de empresa; contabilidade mensal; folha; imposto de renda; MEI.\nOutro nicho: mesma lógica, os serviços que um cliente comum espera.\nReescreva também, para o nicho: faixa que rola, 4 benefícios, \"Por que [fazer o serviço]\" com 4 situações, 3 passos e 6 perguntas frequentes (respostas honestas, sem prazo ou preço inventado). Cada link de card abre o WhatsApp com mensagem citando o serviço.\n\n==================================================\n5. LOGO E SUBSTITUIÇÃO DAS FOTOS\n==================================================\n5.1 LOGO (a imagem anexada): trate antes de usar.\n- Remova o fundo (deixe transparente). Se a logo tiver fundo branco/colorido que não combina com o lugar onde vai, tire. Corte as sobras vazias em volta.\n- Se estiver pequena, borrada ou torta, melhore/recrie fielmente (mesmas letras, mesmo símbolo, mesmas cores; NÃO invente letras nem troque o desenho).\n- Gere: logo-clara.png (versão para fundo escuro: cabeçalho, rodapé e capa), logo.png (versão normal) e simbolo.png (só o símbolo, se existir). Salve em img/.\n- Tamanho certo: no cabeçalho altura ~40px, no rodapé ~44px, nunca esticada (use height fixa e width:auto / object-fit:contain).\n5.2 Paleta: da logo tire --royal (principal), --royal-2 (12% mais clara), --deep (bem escura), --lime (destaque vibrante, com bom contraste com --deep), --lime-2 (destaque um pouco mais escuro), --bg (quase branco tingido), --ink, --muted, --line. Logo de uma cor só: crie o destaque em contraste harmônico.\n5.3 IMAGENS — VOCÊ GERA com a ferramenta de geração de imagem. NADA de ilustração SVG, desenho plano, ícone ou elemento gráfico no lugar das fotos: são FOTOS realistas geradas por IA.\nEstilo de todas: fotografia profissional realista, luz natural, cores vivas combinando com a paleta, nítida, sem texto escrito, sem marca d'água, sem logotipos de outras empresas, pessoas brasileiras quando aparecerem. Salve cada uma em img/ (formato .jpg ou .webp, leve) e troque o marcador pelo caminho do arquivo.\n- LOGO_ICONE → img/simbolo.png (ou img/logo.png pequena). Na .final o CSS aplica um filter para escurecer: se ficar feio, gere uma versão escura do símbolo.\n- LOGO_NOME_CLARA → img/logo-clara.png.\n- FAVICON_SVG → img/simbolo.png (ou a logo recortada quadrada).\n- FOTO_CAPA (proporção 4:5, a imagem grande da parte inicial do site, dentro da moldura em arco) → depende do que eu anexei:\n  a) Anexei FOTO DA PESSOA (com ou sem logo): a capa é ESSA FOTO da pessoa. Não gere outra pessoa, não troque o rosto, não coloque logo na roupa dela. Só melhore (luz, nitidez, recorte 4:5 centralizado no rosto/corpo, sem esticar). Se também veio logo, a logo vai só no cabeçalho, rodapé e demais lugares de logo.\n  b) Anexei SÓ A LOGO: a capa é a LOGO. Gere uma imagem de fundo bonita e profissional (degradê/textura nas cores da paleta, luz suave, sem pessoas, sem texto) e coloque a logo tratada (sem fundo, versão que contrasta) grande e centralizada por cima, com respiro nas bordas e sombra suave. Salve como img/capa.jpg.\n  c) Não anexei nada: gere uma foto realista do serviço principal do nicho, sem pessoas.\n- FOTO_SERVICO_1 a 6 (4:3) → uma foto gerada para CADA serviço do card (ex.: sofá limpo, banco de carro higienizado, colchão, cadeiras, tapete, tecido com gotas de impermeabilização). SEM PESSOAS: nenhuma pessoa, mão, rosto ou corpo nessas imagens. Mostre só o objeto/resultado/equipamento do serviço, bem fotografado.\n- FOTO_ANTES e FOTO_DEPOIS (3:2) → SEM PESSOAS. Gere a MESMA cena/objeto duas vezes, mesmo ângulo: \"antes\" sujo/gasto/com problema e \"depois\" limpo/renovado/resolvido. Se o nicho não tiver antes/depois (ex.: advocacia, contabilidade), troque o título por \"Antes e depois de falar com a gente\" e gere duas imagens sem pessoas (ex.: mesa bagunçada com papéis → mesa organizada), mantendo a chave Antes/Depois funcionando.\n- FOTO_ATENDIMENTO (3:4) → foto do veículo de serviço/atendimento do nicho (van, carro ou fachada) nas cores da empresa, com a logo aplicada na lateral/fachada, em rua de cidade brasileira.\n- Se a sua ferramenta realmente não conseguir gerar alguma imagem, avise no fim e deixe o \u003cimg> com o caminho img/NOME.jpg certo para eu colocar depois. NÃO troque por SVG.\n5.4 Nada esticado, pixelado, cortado de forma estranha ou com fundo quadriculado.\n\n==================================================\n6. WHATSAPP\n==================================================\nBase: {{link_whatsapp}} + ?text= com mensagem codificada (encodeURIComponent). Troque em TODOS os lugares do código (cabeçalho, capa, cada card, atendimento, bloco final, contatos e botão flutuante). Mensagens educadas e com o nome da empresa, por exemplo \"Olá, {{nome}}! Quero um orçamento.\" e \"Olá! Quero orçamento de [serviço].\".\n\n==================================================\n7. CELULAR\n==================================================\nO código já é responsivo. Depois das trocas, confira em 360, 390 e 414 px: nada vaza para o lado, título da capa sem palavra quebrada, imagens proporcionais, sem distorção.\n\n==================================================\n8. CONFERÊNCIA ANTES DE ENTREGAR\n==================================================\n[ ] Código base mantido (estrutura, CSS, JS); só trocou o que o item 2 manda.\n[ ] Nenhum dado inventado; seções sem dado removidas.\n[ ] Nada sobrou da Limpteck (item 3.7).\n[ ] Logo nítida, sem fundo indesejado, sem letras trocadas.\n[ ] Todas as fotos geradas por IA (realistas, do nicho, mesmo estilo), salvas em img/, nenhuma ilustração SVG no lugar de foto. Logo sem fundo e no tamanho certo. Capa = foto da pessoa (se anexada) ou a logo em destaque. Fotos de serviços e antes/depois SEM pessoas.\n[ ] Todos os botões levam ao contato certo.\n[ ] Quantidade de cards = quantidade de bolinhas .dots.\n[ ] Crédito da Agência Nitro intacto.\nEntregue o index.html completo e, depois, uma lista curta do que você criou sem dado da empresa (ex.: serviços deduzidos do nicho).\n\n==================================================\n9. CÓDIGO COMPLETO DO SITE MODELO (LIMPTECK) — USE COMO BASE EXATA\n==================================================\n\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Limpteck · Higienização de Estofados em Vitória da Conquista\u003c/title>\n\u003cmeta name=\"description\" content=\"Higienização de sofás, cadeiras, camas box, colchões e interior de carros e caminhões em Vitória da Conquista e região. Elimina ácaros, fungos e bactérias. Orçamento pelo WhatsApp.\">\n\u003cmeta name=\"theme-color\" content=\"#1b26a8\">\n\u003clink rel=\"icon\" href=\"FAVICON_SVG\">\n\u003cmeta property=\"og:title\" content=\"Limpteck · Limpeza Inteligente\">\n\u003cmeta property=\"og:description\" content=\"Seu estofado limpo, sua família mais feliz. Higienização em Vitória da Conquista e região.\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--royal:#1b26a8;--royal-2:#2633c9;--deep:#0c1260;--lime:#dcff2e;--lime-2:#c6ec00;--bg:#f4f6ff;--ink:#0e1240;--muted:#5a6085;--line:#dfe3f5;--wa:#1fb85a;--r:22px}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{overflow-x:hidden;scroll-behavior:smooth;-webkit-text-size-adjust:100%}\nbody{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}\nimg{display:block;max-width:100%}\na{color:inherit;text-decoration:none}\nh1,h2,h3{font-family:Poppins,sans-serif;line-height:1.08;letter-spacing:-.02em}\n.wrap{width:min(1120px,100% - 40px);margin-inline:auto}\n.tag{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 Poppins;letter-spacing:.14em;text-transform:uppercase;color:var(--royal)}\n.tag::before{content:\"\";width:18px;height:3px;border-radius:3px;background:var(--lime-2)}\nh2{font-size:clamp(30px,7.4vw,46px);font-weight:800;margin:12px 0 14px}\nh2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--lime) 58% 92%,transparent 92%);padding:0 4px}\n.lead{color:var(--muted);font-size:17px;max-width:560px}\nsection{padding:76px 0}\n\n/* botões */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 16px/1 Poppins;padding:18px 24px;border-radius:999px;transition:transform .2s,box-shadow .2s}\n.btn:active{transform:scale(.97)}\n.btn svg{width:22px;height:22px;flex:none}\n.btn-lime{background:var(--lime);color:var(--deep);box-shadow:0 10px 30px -8px rgba(220,255,46,.6)}\n.btn-lime:hover{transform:translateY(-2px)}\n.btn-ghost{border:2px solid rgba(255,255,255,.28);color:#fff}\n.btn-wa{background:var(--wa);color:#fff;box-shadow:0 12px 30px -10px rgba(31,184,90,.7)}\n\n/* header */\nheader{position:sticky;top:0;z-index:50;background:rgba(27,38,168,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}\n.nav{display:flex;align-items:center;justify-content:space-between;height:66px}\n.brand{display:flex;align-items:center;gap:10px}\n.brand .ic{height:34px;width:auto}\n.brand .wm{height:22px;width:auto}\n.nav .btn{padding:11px 16px;font-size:14px}\n\n/* hero */\n.hero{background:radial-gradient(120% 80% at 90% 10%,var(--royal-2),var(--royal) 45%,var(--deep));color:#fff;padding:34px 0 0;border-radius:0 0 40px 40px;position:relative;overflow:hidden}\n.hero::after{content:\"\";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px;mask:linear-gradient(#000,transparent 70%);pointer-events:none}\n.hero .wrap{position:relative;z-index:1;display:grid;gap:30px}\n.loc{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;width:max-content}\n.loc svg{width:16px;height:16px;color:var(--lime)}\n.hero h1{font-size:clamp(40px,11vw,70px);font-weight:800;margin:18px 0 16px}\n.hero h1 .hl{color:var(--lime)}\n.hero p.sub{font-size:17px;color:rgba(255,255,255,.82);max-width:470px}\n.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}\n.cta-row .btn{flex:1 1 auto}\n.proof{display:flex;gap:22px;margin-top:26px;font-size:13px;color:rgba(255,255,255,.75)}\n.proof b{display:block;font:800 24px/1 Poppins;color:#fff;margin-bottom:4px}\n.hero-photo{position:relative;align-self:end;margin:0 auto 48px;width:min(400px,92%)}\n.hero-photo .blob{position:absolute;left:50%;bottom:0;width:92%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:var(--lime);box-shadow:0 0 0 14px rgba(220,255,46,.18),0 0 0 30px rgba(220,255,46,.07)}\n.hero-photo img{position:relative;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 0;border-radius:999px 999px 30px 30px;border:6px solid var(--lime);box-shadow:0 30px 60px -20px rgba(0,0,0,.55),0 0 0 14px rgba(220,255,46,.14)}\n.hero-photo .chip{position:absolute;background:#fff;color:var(--ink);border-radius:16px;padding:10px 14px;font:600 13px/1.25 Manrope,system-ui,sans-serif;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);display:flex;gap:9px;align-items:center}\n.hero-photo .chip i{width:30px;height:30px;border-radius:10px;background:var(--royal);display:grid;place-items:center;flex:none}\n.hero-photo .chip i svg{width:17px;height:17px;color:var(--lime)}\n.chip.c1{left:-14px;top:30%}.chip.c2{right:-14px;top:74%}\n\n/* faixa */\n.ticker{background:var(--lime);color:var(--deep);overflow:hidden;transform:rotate(-2deg);margin:-14px -10px 0;position:relative;z-index:3}\n.ticker div{display:flex;gap:34px;white-space:nowrap;padding:14px 0;font:700 15px/1 Poppins;text-transform:uppercase;letter-spacing:.04em;animation:tk 26s linear infinite;width:max-content}\n.ticker span::after{content:\"✦\";margin-left:34px}\n@keyframes tk{to{transform:translateX(-50%)}}\n\n/* benefícios */\n.bens{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}\n.ben{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 16px}\n.ben .ico{width:46px;height:46px;border-radius:14px;background:var(--royal);display:grid;place-items:center;margin-bottom:14px}\n.ben .ico svg{width:24px;height:24px;color:var(--lime)}\n.ben h3{font-size:16px;font-weight:700;margin-bottom:5px}\n.ben p{font-size:13.5px;color:var(--muted);line-height:1.45}\n\n/* serviços carrossel */\n.svc-head{display:flex;align-items:end;justify-content:space-between;gap:16px}\n.arrows{display:none;gap:8px}\n.arrows button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center}\n.arrows svg{width:20px;height:20px}\n.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:20px;padding:26px 20px 10px;margin:0 -20px;scrollbar-width:none}\n.rail::-webkit-scrollbar{display:none}\n.card{flex:0 0 78%;max-width:340px;scroll-snap-align:start;background:#fff;border-radius:26px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}\n.card .ph{position:relative}\n.card .ph img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}\n.card .num{position:absolute;top:12px;left:12px;background:var(--lime);color:var(--deep);font:800 13px/1 Poppins;padding:7px 10px;border-radius:999px}\n.card .bd{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}\n.card h3{font-size:20px;font-weight:700}\n.card p{color:var(--muted);font-size:14.5px;margin:6px 0 16px;flex:1}\n.card a{display:inline-flex;align-items:center;gap:8px;font:700 14px/1 Poppins;color:var(--royal)}\n.card a svg{width:18px;height:18px;transition:transform .2s}\n.card a:hover svg{transform:translateX(4px)}\n.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}\n.dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:all .3s}\n.dots i.on{width:22px;background:var(--royal)}\n\n/* antes depois */\n.ba{background:var(--deep);color:#fff;border-radius:40px;margin:0 10px;padding:66px 0}\n.ba .tag{color:var(--lime)}\n.ba .lead{color:rgba(255,255,255,.72)}\n.ba-box{position:relative;margin-top:28px;border-radius:26px;overflow:hidden;aspect-ratio:3/2;background:#000}\n.ba-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease}\n.ba-box .after{opacity:0}\n.ba-box.show-after .after{opacity:1}\n.ba-label{position:absolute;top:14px;left:14px;z-index:2;background:rgba(12,18,96,.75);backdrop-filter:blur(6px);padding:7px 12px;border-radius:999px;font:700 12px/1 Poppins;letter-spacing:.1em;text-transform:uppercase}\n.ba-label b{color:var(--lime);font-weight:700}\n.switch{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.08);border-radius:999px;padding:5px;margin-top:16px;position:relative}\n.switch button{position:relative;z-index:1;border:0;background:none;color:#fff;font:700 15px/1 Poppins;padding:15px;border-radius:999px;cursor:pointer;transition:color .3s}\n.switch .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);background:var(--lime);border-radius:999px;transition:transform .4s cubic-bezier(.6,.2,.2,1)}\n.switch.after .pill{transform:translateX(100%)}\n.switch button.on{color:var(--deep)}\n\n/* por que */\n.why{display:grid;gap:26px}\n.why-card{background:linear-gradient(135deg,var(--royal),var(--royal-2));color:#fff;border-radius:28px;padding:28px 24px;position:relative;overflow:hidden}\n.why-card::before{content:\"\";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--lime);opacity:.16}\n.why-card h3{font-size:22px;margin-bottom:10px}\n.why-card p{color:rgba(255,255,255,.8);font-size:15px}\n.list{display:grid;gap:12px;margin-top:6px}\n.list li{list-style:none;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}\n.list li i{width:26px;height:26px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex:none;margin-top:1px}\n.list li i svg{width:15px;height:15px;color:var(--deep)}\n.list b{display:block;font-family:Poppins;font-weight:600}\n.list span{font-size:14px;color:var(--muted)}\n\n/* passos */\n.steps{display:grid;gap:0;margin-top:30px;position:relative}\n.step{display:grid;grid-template-columns:58px 1fr;gap:16px;padding-bottom:26px;position:relative}\n.step:not(:last-child)::before{content:\"\";position:absolute;left:28px;top:58px;bottom:0;width:2px;background:repeating-linear-gradient(var(--royal) 0 6px,transparent 6px 12px);opacity:.35}\n.step .n{width:58px;height:58px;border-radius:18px;background:var(--royal);color:var(--lime);font:800 24px/58px Poppins;text-align:center}\n.step h3{font-size:19px;margin:6px 0 4px}\n.step p{color:var(--muted);font-size:15px}\n\n/* área */\n.area{background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px 22px;display:grid;gap:18px;align-items:center}\n.area .pin{width:64px;height:64px;border-radius:20px;background:var(--lime);display:grid;place-items:center}\n.area .pin svg{width:32px;height:32px;color:var(--deep)}\n.area h3{font-size:24px}\n.area p{color:var(--muted)}\n\n/* van */\n.van{background:#fff;border:1px solid var(--line);border-radius:30px;overflow:hidden;display:grid}\n.van img{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;object-position:50% 50%}\n.van-bd{padding:24px 22px 26px}\n.van-bd h3{font-size:25px;margin:10px 0 8px}\n.van-bd p{color:var(--muted);margin-bottom:20px}\n/* faq */\n.faq{margin-top:26px;display:grid;gap:10px}\ndetails{background:#fff;border:1px solid var(--line);border-radius:18px;padding:0 18px;transition:background .2s}\ndetails[open]{background:#fff;box-shadow:0 14px 30px -20px rgba(27,38,168,.45)}\nsummary{list-style:none;cursor:pointer;padding:18px 0;font:600 16px/1.35 Poppins;display:flex;justify-content:space-between;gap:12px;align-items:center}\nsummary::-webkit-details-marker{display:none}\nsummary::after{content:\"+\";width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:20px;color:var(--royal);flex:none;transition:transform .3s}\ndetails[open] summary::after{transform:rotate(45deg);background:var(--lime)}\ndetails p{padding:0 0 18px;color:var(--muted);font-size:15px}\n\n/* cta final */\n.final{background:var(--lime);color:var(--deep);border-radius:40px 40px 0 0;padding:70px 0 40px;text-align:center;position:relative;overflow:hidden}\n.final .big-ic{width:70px;margin:0 auto 18px;filter:brightness(0) saturate(100%) invert(9%) sepia(60%) saturate(4500%) hue-rotate(236deg)}\n.final h2{font-size:clamp(34px,9vw,58px)}\n.final p{max-width:480px;margin:0 auto 26px;font-size:17px;color:#2a3070}\n.final .btn-wa{font-size:17px;padding:20px 28px}\n.contacts{display:grid;gap:10px;margin:34px auto 0;max-width:420px;text-align:left}\n.contacts a{display:flex;align-items:center;gap:14px;background:rgba(12,18,96,.08);border-radius:18px;padding:14px 16px;font-weight:600}\n.contacts a i{width:42px;height: -items:center}.van img{height:100%;aspect-ratio:auto;min-height:380px}.van-bd{padding:40px}\n  .faq{grid-template-columns:1fr 1fr;align-items:start}\n  .contacts{grid-template-columns:1fr 1fr;max-width:640px}\n}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader>\n  \u003cdiv class=\"wrap nav\">\n    \u003ca href=\"#topo\" class=\"brand\" aria-label=\"Limpteck\">\u003cimg class=\"ic\" src=\"LOGO_ICONE\" alt=\"\">\u003cimg class=\"wm\" src=\"LOGO_NOME_CLARA\" alt=\"Limpteck\">\u003c/a>\n    \u003ca class=\"btn btn-lime\" href=\"https://wa.me/5577988056186?text=Ol%C3%A1%2C%20Limpteck!%20Quero%20um%20or%C3%A7amento.\" target=\"_blank\" rel=\"noopener\">Orçamento\u003c/a>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain id=\"topo\">\n\u003csection class=\"hero\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"copy\">\n      \u003cspan class=\"loc\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z\"/>\u003ccircle cx=\"12\" cy=\"10\" r=\"2.5\"/>\u003c/svg>Vitória da Conquista e região\u003c/span>\n      \u003ch1>Seu estofado limpo, sua família \u003cspan class=\"hl\">mais feliz.\u003c/span>\u003c/h1>\n      \u003cp class=\"sub\">Higienização profissional de sofás, cadeiras, camas box, tapetes e do interior de carros e caminhões. Eliminamos ácaros, fungos e bactérias, e vamos até você.\u003c/p>\n      \u003cdiv class=\"cta-row\">\n        \u003ca class=\"btn btn-lime\" href=\"https://wa.me/5577988056186?text=Ol%C3%A1%2C%20Limpteck!%20Quero%20um%20or%C3%A7amento%20de%20higieniza%C3%A7%C3%A3o.\" target=\"_blank\" rel=\"noopener\">\u003csvg viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003cuse href=\"#wa\"/>\u003c/svg>Orçamento grátis\u003c/a>\n        \u003ca class=\"btn btn-ghost\" href=\"#servicos\">Ver serviços\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"proof\">\n        \u003cdiv>\u003cb>+1.200\u003c/b>trabalhos postados\u003c/div>\n        \u003cdiv>\u003cb>+2.400\u003c/b>seguidores no Insta\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"hero-photo\">\n      \n      \u003cimg src=\"FOTO_CAPA\" alt=\"Profissional da Limpteck\" width=\"840\" height=\"1050\">\n      \u003cdiv class=\"chip c1\">\u003ci>\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\">\u003cpath d=\"M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z\"/>\u003cpath d=\"M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z\"/>\u003c/svg>\u003c/i>Estofado\u003cbr>renovado\u003c/div>\n      \u003cdiv class=\"chip c2\">\u003ci>\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z\"/>\u003cpath d=\"M9 12l2 2 4-4\"/>\u003c/svg>\u003c/i>Sem ácaros\u003cbr>e bactérias\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"ticker\" aria-hidden=\"true\">\u003cdiv>\n  \u003cspan>Sofás\u003c/span>\u003cspan>Cadeiras\u003c/span>\u003cspan>Camas box\u003c/span>\u003cspan>Colchões\u003c/span>\u003cspan>Tapetes\u003c/span>\u003cspan>Carpetes\u003c/span>\u003cspan>Carros\u003c/span>\u003cspan>Caminhões\u003c/span>\u003cspan>Elimina ácaros\u003c/span>\u003cspan>Secagem rápida\u003c/span>\n  \u003cspan>Sofás\u003c/span>\u003cspan>Cadeiras\u003c/span>\u003cspan>Camas box\u003c/span>\u003cspan>Colchões\u003c/span>\u003cspan>Tapetes\u003c/span>\u003cspan>Carpetes\u003c/span>\u003cspan>Carros\u003c/span>\u003cspan>Caminhões\u003c/span>\u003cspan>Elimina ácaros\u003c/span>\u003cspan>Secagem rápida\u003c/span>\n\u003c/div>\u003c/div>\n\n\u003csection id=\"beneficios\">\n  \u003cdiv class=\"wrap\">\n    \u003cspan class=\"tag rv\">Limpeza inteligente\u003c/span>\n    \u003ch2 class=\"rv\">Muito além de \u003cem>tirar mancha\u003c/em>\u003c/h2>\n    \u003cp class=\"lead rv\">A extração profunda puxa a sujeira que fica lá dentro da espuma, onde o aspirador e o pano não chegam.\u003c/p>\n    \u003cdiv class=\"bens\">\n      \u003cdiv class=\"ben rv\">\u003cdiv class=\"ico\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5L19 19M19 5l-2.5 2.5M7.5 16.5L5 19\"/>\u003cpath d=\"M4 20L20 4\"/>\u003c/svg>\u003c/div>\u003ch3>Elimina ácaros\u003c/h3>\u003cp>Fungos e bactérias saem junto com a água suja.\u003c/p>\u003c/div>\n      \u003cdiv class=\"ben rv\">\u003cdiv class=\"ico\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z\"/>\u003cpath d=\"M12 9v6M9 12h6\"/>\u003c/svg>\u003c/div>\u003ch3>Mais saúde\u003c/h3>\u003cp>Menos alergia, rinite e crise de espirro em casa.\u003c/p>\u003c/div>\n      \u003cdiv class=\"ben rv\">\u003cdiv class=\"ico\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 18v-5a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v5\"/>\u003cpath d=\"M2 18h20M6 10V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2\"/>\u003c/svg>\u003c/div>\u003ch3>Estofado renovado\u003c/h3>\u003cp>Cor de volta, tecido macio e cara de novo.\u003c/p>\u003c/div>\n      \u003cdiv class=\"ben rv\">\u003cdiv class=\"ico\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M11 20A7 7 0 0 1 4 13c0-5 4-9 16-9 0 12-4 16-9 16z\"/>\u003cpath d=\"M4 20c4-6 7-8 11-10\"/>\u003c/svg>\u003c/div>\u003ch3>Ambiente agradável\u003c/       var k = bkey(this.value), r = $("#bQr", s);
      if (!k) { r.textContent = ""; return; }
      if (burnSet()[k]) { r.innerHTML = '<b style="color:var(--red)">Queimado.</b> <button class="link" id="bRm" style="color:var(--g)">Tirar da lista</button>'; $("#bRm", s).onclick = function () { removeBurned(k); r.textContent = "Tirado da lista."; }; }
      else r.innerHTML = '<b style="color:var(--g)">Livre.</b> Não está na lista.';
    };
  });
}
function goalSheet() {
  sheet('<h3>Meta de chamadas por dia</h3><p>Quantas empresas você quer chamar por dia?</p><div class="chips">' + [20, 30, 50, 80, 100, 150].map(function (v) { return '<button class="num" data-v="' + v + '">' + v + "</button>"; }).join("") + "</div>", function (s) {
    $(".chips", s).onclick = function (e) { var b = e.target.closest("[data-v]"); if (!b) return; saveSettings({ goal: +b.dataset.v }); closeSheet(); toast("Meta: " + b.dataset.v + " chamadas por dia."); };
  });
}
function csvCell(v) { v = String(v == null ? "" : v); return /[";\n]/.test(v) ? '"' + v.split('"').join('""') + '"' : v; }
async function exportCsv() {
  var cols = [["name", "Empresa"], ["phone", "Telefone"], ["wa", "WhatsApp"], ["city", "Cidade"], ["state", "Estado"], ["address", "Endereço"], ["rating", "Nota"], ["reviews_count", "Avaliações"], ["nicho", "Nicho"], ["stage", "Etapa"], ["link", "Site"], ["value", "Valor"]];
  var rows = [cols.map(function (c) { return c[1]; }).join(";")];
  ST.companies.forEach(function (c) { rows.push(cols.map(function (k) { return csvCell(c[k[0]]); }).join(";")); });
  try {
    var dl = await claude.use("downloads");
    if (!dl) { toast("Download indisponível aqui."); return; }
    await dl.save({ filename: "nitro-vendas-" + new Date().toISOString().slice(0, 10) + ".csv", data: "\ufeff" + rows.join("\n") });
    closeSheet(); toast(ST.companies.length + " empresas exportadas.");
  } catch (e) { toast("Download cancelado."); }
}
async function downloadPrompt() {
  try {
    var dl = await claude.use("downloads");
    if (!dl) { toast("Download indisponível aqui."); return; }
    await dl.save({ filename: "prompt_site_limpteck.txt", data: genericPrompt() });
    saveSettings({ dl: 1 }); if ($("#sheet").hidden) render();
    toast("Arquivo salvo em Downloads.");
  } catch (e) { toast("Download cancelado."); }
}
function msgSheet() {
  var n = N(), key = function (k) { return ST.niche + "_" + k; };
  var F = [["wa_site", "Avisar que o site ficou pronto"], ["wa_follow", "Insistir depois do site pronto"]];
  sheet("<h3>Mensagens</h3><p>{{saud}} = bom dia/boa tarde/boa noite · {{servico}} = serviço do nicho · {{nome}} = nome da empresa · {{link_site}} = link do site</p>" +
    '<span class="lbl">Saudações (uma por linha · cada empresa recebe uma diferente)</span><textarea class="msg" data-g="greets" style="min-height:190px">' + esc(greetList("greets", GREETS).join("\n")) + "</textarea>" +
    '<span class="lbl">Insistir</span><textarea class="msg" data-g="regreets">' + esc(greetList("regreets", REGREETS).join("\n")) + "</textarea>" +
    F.map(function (f) { return '<span class="lbl">' + f[1] + '</span><textarea class="msg" data-k="' + f[0] + '">' + esc((ST.settings[key(f[0])] || "").trim() || n[f[0]]) + "</textarea>"; }).join("") +
    '<div class="row2"><button class="btn" id="mReset">Restaurar padrão</button><button class="btn pri" id="mSave">Salvar</button></div>', function (s) {
    $("#mSave", s).onclick = function () {
      var p = {};
      $$("[data-g]", s).forEach(function (t) { var d = t.dataset.g === "greets" ? GREETS : REGREETS, v = t.value.trim(); p[key(t.dataset.g)] = v === d.join("\n") ? "" : v; });
      $$("[data-k]", s).forEach(function (t) { var v = t.value.trim(); p[key(t.dataset.k)] = v === n[t.dataset.k] ? "" : v; });
      saveSettings(p); closeSheet(); toast("Mensagens salvas.");
    };
    $("#mReset", s).onclick = function () { $("[data-g=greets]", s).value = GREETS.join("\n"); $("[data-g=regreets]", s).value = REGREETS.join("\n"); $$("[data-k]", s).forEach(function (t) { t.value = n[t.dataset.k]; }); };
  });
}
}
